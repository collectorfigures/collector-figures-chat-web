name: CFS Web immutable release

on:
    push:
        tags: ["cfs-web-v*"]

permissions:
    contents: read
    packages: write
    id-token: write

concurrency:
    group: cfs-web-release-${{ github.ref_name }}
    cancel-in-progress: false

env:
    IMAGE: ghcr.io/collectorfigures/collector-figures-chat-web
    LOCAL_IMAGE: cfs-web-prepublish:${{ github.sha }}
    CANDIDATE_TAG: candidate-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
    CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/cfs-release.yml@refs/tags/${{ github.ref_name }}

jobs:
    build-scan-publish:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Verify release tag is the exact protected main commit
              run: |
                  git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
                  tag_commit="$(git rev-parse "$GITHUB_SHA^{commit}")"
                  main_commit="$(git rev-parse 'refs/remotes/origin/main^{commit}')"
                  test "$tag_commit" = "$GITHUB_SHA"
                  test "$tag_commit" = "$main_commit"
                  jq -n \
                    --arg tag_ref "refs/tags/$GITHUB_REF_NAME" \
                    --arg tag_commit "$tag_commit" \
                    --arg protected_main_commit "$main_commit" \
                    '{tag_ref: $tag_ref, tag_commit: $tag_commit, protected_main_commit: $protected_main_commit}' \
                    > RELEASE-SOURCE.json
            - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
            - name: Build exact source locally
              id: build
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: .
                  file: apps/web/Dockerfile
                  platforms: linux/amd64
                  load: true
                  push: false
                  tags: ${{ env.LOCAL_IMAGE }}
                  build-args: CFS_SOURCE_COMMIT=${{ github.sha }}
                  provenance: false
                  sbom: false
            - name: Freeze local image identity and BuildKit metadata
              env:
                  BUILDKIT_METADATA: ${{ steps.build.outputs.metadata }}
              run: |
                  docker image inspect "$LOCAL_IMAGE" > LOCAL-IMAGE-INSPECT.json
                  docker save "$LOCAL_IMAGE" --output LOCAL-IMAGE.tar
                  printf '%s\n' "$BUILDKIT_METADATA" > BUILDKIT-METADATA.json
                  jq -e . BUILDKIT-METADATA.json >/dev/null
                  sha256sum LOCAL-IMAGE.tar > LOCAL-IMAGE-SHA256.txt
            - name: Scan local image before publication
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  image-ref: ${{ env.LOCAL_IMAGE }}
                  format: json
                  output: trivy.json
                  severity: CRITICAL,HIGH
                  ignore-unfixed: false
                  exit-code: "1"
            - name: Generate SPDX SBOM before publication
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  image-ref: ${{ env.LOCAL_IMAGE }}
                  format: spdx-json
                  output: sbom.spdx.json
                  exit-code: "0"
            - name: Generate CycloneDX SBOM before publication
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  image-ref: ${{ env.LOCAL_IMAGE }}
                  format: cyclonedx
                  output: sbom.cyclonedx.json
                  exit-code: "0"
            - name: Create and verify prepublication provenance
              run: |
                  jq -n \
                    --arg source "git+https://github.com/${GITHUB_REPOSITORY}@refs/tags/${GITHUB_REF_NAME}" \
                    --arg commit "$GITHUB_SHA" \
                    --arg builder "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
                    --arg invocation "$GITHUB_RUN_ID-${GITHUB_RUN_ATTEMPT}" \
                    --arg dockerfile_sha256 "$(sha256sum apps/web/Dockerfile | cut -d' ' -f1)" \
                    --arg image_tar_sha256 "$(cut -d' ' -f1 LOCAL-IMAGE-SHA256.txt)" \
                    '{
                      buildDefinition: {
                        buildType: "https://collectorfigures.com/attestations/github-actions-docker/v1",
                        externalParameters: {source: $source, dockerfile: "apps/web/Dockerfile"},
                        internalParameters: {platform: "linux/amd64"},
                        resolvedDependencies: [{uri: $source, digest: {gitCommit: $commit}}]
                      },
                      runDetails: {
                        builder: {id: $builder},
                        metadata: {invocationId: $invocation},
                        byproducts: [
                          {name: "dockerfile", digest: {sha256: $dockerfile_sha256}},
                          {name: "local-image-tar", digest: {sha256: $image_tar_sha256}}
                        ]
                      }
                    }' > BUILD-PROVENANCE.json
                  jq -e . trivy.json sbom.spdx.json sbom.cyclonedx.json BUILD-PROVENANCE.json LOCAL-IMAGE-INSPECT.json >/dev/null
                  test "$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL" or .Severity == "HIGH")] | length' trivy.json)" = 0
                  sha256sum trivy.json sbom.spdx.json sbom.cyclonedx.json BUILD-PROVENANCE.json BUILDKIT-METADATA.json LOCAL-IMAGE-INSPECT.json > PREPUBLISH-SHA256SUMS.txt
            - name: Reverify protected main before any registry mutation
              run: |
                  git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
                  test "$(git rev-parse 'refs/remotes/origin/main^{commit}')" = "$GITHUB_SHA"
            - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Publish only the run-scoped candidate tag
              run: |
                  if docker buildx imagetools inspect "$IMAGE:$CANDIDATE_TAG" >/dev/null 2>&1; then
                    echo "::error::Run-scoped candidate tag already exists"
                    exit 1
                  fi
                  docker tag "$LOCAL_IMAGE" "$IMAGE:$CANDIDATE_TAG"
                  docker push "$IMAGE:$CANDIDATE_TAG"
                  docker buildx imagetools inspect --raw "$IMAGE:$CANDIDATE_TAG" > OCI-MANIFEST-CANDIDATE.json
                  candidate_digest="sha256:$(sha256sum OCI-MANIFEST-CANDIDATE.json | cut -d' ' -f1)"
                  printf '%s  %s\n' "$candidate_digest" "$IMAGE" > OCI-DIGEST.txt
            - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
            - name: Sign, attest and verify the candidate digest
              run: |
                  digest="$(cut -d' ' -f1 OCI-DIGEST.txt)"
                  cosign sign --yes "$IMAGE@$digest"
                  cosign attest --yes --type slsaprovenance --predicate BUILD-PROVENANCE.json "$IMAGE@$digest"
                  cosign verify "$IMAGE@$digest" --certificate-identity "$CERTIFICATE_IDENTITY" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" > COSIGN-VERIFY.json
                  cosign verify-attestation --type slsaprovenance "$IMAGE@$digest" --certificate-identity "$CERTIFICATE_IDENTITY" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" > COSIGN-ATTESTATION-VERIFY.json
                  jq -e . COSIGN-VERIFY.json COSIGN-ATTESTATION-VERIFY.json >/dev/null
                  sha256sum OCI-DIGEST.txt OCI-MANIFEST-CANDIDATE.json COSIGN-VERIFY.json COSIGN-ATTESTATION-VERIFY.json >> PREPUBLISH-SHA256SUMS.txt
            - name: Promote the verified digest without overwriting formal tags
              run: |
                  digest="$(cut -d' ' -f1 OCI-DIGEST.txt)"
                  promote_or_verify_tag() {
                    tag="$1"
                    final_manifest="$2"
                    existing_manifest="${final_manifest%.json}-EXISTING.json"
                    if docker buildx imagetools inspect --raw "$IMAGE:$tag" > "$existing_manifest" 2>/dev/null; then
                      existing_digest="sha256:$(sha256sum "$existing_manifest" | cut -d' ' -f1)"
                      if [ "$existing_digest" != "$digest" ]; then
                        echo "::error::Refusing to overwrite $IMAGE:$tag ($existing_digest != $digest)"
                        exit 1
                      fi
                    else
                      rm -f "$existing_manifest"
                      docker buildx imagetools create --tag "$IMAGE:$tag" "$IMAGE@$digest"
                    fi
                    docker buildx imagetools inspect --raw "$IMAGE:$tag" > "$final_manifest"
                    final_digest="sha256:$(sha256sum "$final_manifest" | cut -d' ' -f1)"
                    test "$final_digest" = "$digest"
                  }
                  promote_or_verify_tag "$GITHUB_REF_NAME" OCI-MANIFEST-TAG.json
                  promote_or_verify_tag "sha-$GITHUB_SHA" OCI-MANIFEST-SHA.json
                  sha256sum OCI-MANIFEST-TAG.json OCI-MANIFEST-SHA.json >> PREPUBLISH-SHA256SUMS.txt
            - name: Upload complete release evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: cfs-web-${{ github.ref_name }}-evidence
                  path: |
                      BUILD-PROVENANCE.json
                      BUILDKIT-METADATA.json
                      COSIGN-ATTESTATION-VERIFY.json
                      COSIGN-VERIFY.json
                      LOCAL-IMAGE-INSPECT.json
                      LOCAL-IMAGE-SHA256.txt
                      OCI-DIGEST.txt
                      OCI-MANIFEST-CANDIDATE.json
                      OCI-MANIFEST-SHA-EXISTING.json
                      OCI-MANIFEST-SHA.json
                      OCI-MANIFEST-TAG-EXISTING.json
                      OCI-MANIFEST-TAG.json
                      PREPUBLISH-SHA256SUMS.txt
                      RELEASE-SOURCE.json
                      sbom.cyclonedx.json
                      sbom.spdx.json
                      trivy.json
                  if-no-files-found: error
                  retention-days: 90
