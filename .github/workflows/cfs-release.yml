name: CFS Web immutable release

on:
    push:
        tags: ["cfs-web-v*"]

permissions:
    contents: read
    packages: write
    id-token: write

env:
    IMAGE: ghcr.io/collectorfigures/collector-figures-chat-web
    LOCAL_IMAGE: cfs-web-prepublish:${{ github.sha }}

jobs:
    build-scan-publish:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
            - name: Build exact source locally
              id: build
              uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
              with:
                  context: .
                  file: apps/web/Dockerfile
                  platforms: linux/amd64
                  load: true
                  push: false
                  tags: ${{ env.LOCAL_IMAGE }}
                  build-args: CFS_SOURCE_COMMIT=${{ github.sha }}
                  provenance: false
                  sbom: false
            - name: Freeze local image identity and BuildKit metadata
              env:
                  BUILDKIT_METADATA: ${{ steps.build.outputs.metadata }}
              run: |
                  docker image inspect "$LOCAL_IMAGE" > LOCAL-IMAGE-INSPECT.json
                  docker save "$LOCAL_IMAGE" --output LOCAL-IMAGE.tar
                  printf '%s\n' "$BUILDKIT_METADATA" > BUILDKIT-METADATA.json
                  jq -e . BUILDKIT-METADATA.json >/dev/null
                  sha256sum LOCAL-IMAGE.tar > LOCAL-IMAGE-SHA256.txt
            - name: Scan local image before publication
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  image-ref: ${{ env.LOCAL_IMAGE }}
                  format: json
                  output: trivy.json
                  severity: CRITICAL,HIGH
                  ignore-unfixed: false
                  exit-code: "1"
            - name: Generate SPDX SBOM before publication
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  image-ref: ${{ env.LOCAL_IMAGE }}
                  format: spdx-json
                  output: sbom.spdx.json
                  exit-code: "0"
            - name: Generate CycloneDX SBOM before publication
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              with:
                  image-ref: ${{ env.LOCAL_IMAGE }}
                  format: cyclonedx
                  output: sbom.cyclonedx.json
                  exit-code: "0"
            - name: Create and verify prepublication provenance
              run: |
                  jq -n \
                    --arg source "git+https://github.com/${GITHUB_REPOSITORY}@refs/tags/${GITHUB_REF_NAME}" \
                    --arg commit "$GITHUB_SHA" \
                    --arg builder "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
                    --arg invocation "$GITHUB_RUN_ID-${GITHUB_RUN_ATTEMPT}" \
                    --arg dockerfile_sha256 "$(sha256sum apps/web/Dockerfile | cut -d' ' -f1)" \
                    --arg image_tar_sha256 "$(cut -d' ' -f1 LOCAL-IMAGE-SHA256.txt)" \
                    '{
                      buildDefinition: {
                        buildType: "https://collectorfigures.com/attestations/github-actions-docker/v1",
                        externalParameters: {source: $source, dockerfile: "apps/web/Dockerfile"},
                        internalParameters: {platform: "linux/amd64"},
                        resolvedDependencies: [{uri: $source, digest: {gitCommit: $commit}}]
                      },
                      runDetails: {
                        builder: {id: $builder},
                        metadata: {invocationId: $invocation},
                        byproducts: [
                          {name: "dockerfile", digest: {sha256: $dockerfile_sha256}},
                          {name: "local-image-tar", digest: {sha256: $image_tar_sha256}}
                        ]
                      }
                    }' > BUILD-PROVENANCE.json
                  jq -e . trivy.json sbom.spdx.json sbom.cyclonedx.json BUILD-PROVENANCE.json LOCAL-IMAGE-INSPECT.json >/dev/null
                  test "$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL" or .Severity == "HIGH")] | length' trivy.json)" = 0
                  sha256sum trivy.json sbom.spdx.json sbom.cyclonedx.json BUILD-PROVENANCE.json BUILDKIT-METADATA.json LOCAL-IMAGE-INSPECT.json > PREPUBLISH-SHA256SUMS.txt
            - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Publish the already-scanned local image
              run: |
                  docker tag "$LOCAL_IMAGE" "$IMAGE:$GITHUB_REF_NAME"
                  docker tag "$LOCAL_IMAGE" "$IMAGE:sha-$GITHUB_SHA"
                  docker push "$IMAGE:$GITHUB_REF_NAME"
                  docker push "$IMAGE:sha-$GITHUB_SHA"
                  docker buildx imagetools inspect --raw "$IMAGE:$GITHUB_REF_NAME" > OCI-MANIFEST-TAG.json
                  docker buildx imagetools inspect --raw "$IMAGE:sha-$GITHUB_SHA" > OCI-MANIFEST-SHA.json
                  tag_digest="sha256:$(sha256sum OCI-MANIFEST-TAG.json | cut -d' ' -f1)"
                  sha_digest="sha256:$(sha256sum OCI-MANIFEST-SHA.json | cut -d' ' -f1)"
                  test "$tag_digest" = "$sha_digest"
                  printf '%s  %s\n' "$tag_digest" "$IMAGE" > OCI-DIGEST.txt
            - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
            - name: Sign and attest the immutable digest
              run: |
                  digest="$(cut -d' ' -f1 OCI-DIGEST.txt)"
                  cosign sign --yes "$IMAGE@$digest"
                  cosign attest --yes --type slsaprovenance --predicate BUILD-PROVENANCE.json "$IMAGE@$digest"
                  cosign verify "$IMAGE@$digest" --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" > COSIGN-VERIFY.json
                  cosign verify-attestation --type slsaprovenance "$IMAGE@$digest" --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/" --certificate-oidc-issuer "https://token.actions.githubusercontent.com" > COSIGN-ATTESTATION-VERIFY.json
                  jq -e . COSIGN-VERIFY.json COSIGN-ATTESTATION-VERIFY.json >/dev/null
                  sha256sum OCI-DIGEST.txt OCI-MANIFEST-TAG.json OCI-MANIFEST-SHA.json COSIGN-VERIFY.json COSIGN-ATTESTATION-VERIFY.json >> PREPUBLISH-SHA256SUMS.txt
            - name: Upload complete release evidence
              if: always()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: cfs-web-${{ github.ref_name }}-evidence
                  path: |
                      BUILD-PROVENANCE.json
                      BUILDKIT-METADATA.json
                      COSIGN-ATTESTATION-VERIFY.json
                      COSIGN-VERIFY.json
                      LOCAL-IMAGE-INSPECT.json
                      LOCAL-IMAGE-SHA256.txt
                      OCI-DIGEST.txt
                      OCI-MANIFEST-SHA.json
                      OCI-MANIFEST-TAG.json
                      PREPUBLISH-SHA256SUMS.txt
                      sbom.cyclonedx.json
                      sbom.spdx.json
                      trivy.json
                  if-no-files-found: error
                  retention-days: 90
