name: CFS Web source verification

on:
    workflow_dispatch:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "24"
            - name: Install the locked package manager
              run: |
                  corepack enable
                  corepack prepare pnpm@11.20.0 --activate
            - name: Install locked dependencies
              run: pnpm install --frozen-lockfile
            - name: Verify CFS privacy and PWA contracts
              run: |
                  node scripts/cfs-verify-webpush-contract.mjs
                  node scripts/cfs-verify-release-workflow.mjs
            - name: Build workspace dependencies for focused tests
              run: pnpm exec nx run element-web:test:unit:prepare
            - name: Run CFS and affected upstream regression tests
              run: >-
                  pnpm --dir apps/web exec vitest run
                  src/cfs-webpush/CfsWebPushManager.test.ts
                  src/cfs-webpush/CfsWebPushCrossTab.test.ts
                  src/cfs-webpush/payload.test.ts
                  src/cfs-webpush/serviceworker.test.ts
                  src/Lifecycle.test.ts
                  src/utils/MediaEventHelper.test.ts
                  src/stores/notifications/RoomNotificationState.test.ts
                  src/settings/SettingsStore.test.ts
                  src/hooks/useNotificationSettings.test.ts
                  src/utils/Feedback.test.ts
                  src/vector/rageshakesetup.test.ts
            - name: Run sanitize-html reply and display regressions
              run: >-
                  pnpm --dir apps/web exec jest
                  --runTestsByPath
                  test/unit-tests/utils/Reply-test.ts
                  test/unit-tests/HtmlUtils-test.tsx
                  test/unit-tests/stores/message-preview/previews/MessageEventPreview-test.ts
                  --runInBand
            - name: Lint CFS source
              run: >-
                  pnpm exec oxlint
                  apps/web/src/cfs-webpush/CfsWebPushManager.ts
                  apps/web/src/cfs-webpush/CfsWebPushManager.test.ts
                  apps/web/src/cfs-webpush/CfsWebPushCrossTab.test.ts
                  apps/web/src/cfs-webpush/CfsWebPushSettings.tsx
                  apps/web/src/cfs-webpush/mutationCoordinator.ts
                  apps/web/src/cfs-webpush/payload.ts
                  apps/web/src/cfs-webpush/notificationGate.ts
                  apps/web/src/cfs-webpush/serviceworker.test.ts
                  apps/web/src/cfs-webpush/serviceworker.ts
                  apps/web/src/serviceworker/index.ts
                  apps/web/src/Lifecycle.ts
                  apps/web/src/vector/platform/WebPlatform.ts
                  apps/web/src/customisations/ComponentVisibility.ts
            - name: Build the production Web/PWA distribution
              run: pnpm --dir apps/web build
            - name: Verify generated artifacts
              run: |
                  test -f apps/web/webapp/cfs-push/sw.js
                  test -f apps/web/webapp/cfs-icons/icon-192.png
                  test -f apps/web/webapp/cfs-icons/icon-512.png
                  test -f apps/web/webapp/cfs-icons/maskable-512.png
                  test -f apps/web/webapp/cfs-icons/apple-touch-icon-180.png
                  test -f apps/web/webapp/cfs-help/index.html
                  test -f apps/web/webapp/manifest.json
                  grep -q '<title>Collector Figures Chat</title>' apps/web/webapp/index.html
                  jq -e '.name == "Collector Figures Chat" and .short_name == "CFS Chat"' apps/web/webapp/manifest.json >/dev/null
                  file apps/web/webapp/cfs-icons/icon-192.png | grep -q '192 x 192'
                  file apps/web/webapp/cfs-icons/icon-512.png | grep -q '512 x 512'
                  grep -q '/cfs-push/active-owner.json' apps/web/webapp/cfs-push/sw.js
                  grep -q 'operationId' apps/web/webapp/cfs-push/sw.js
                  grep -q 'notificationclick' apps/web/webapp/cfs-push/sw.js
                  ! grep -Eqi 'access[_-]?token|MatrixClient|indexedDB|getAuthData' apps/web/webapp/cfs-push/sw.js apps/web/webapp/cfs-push/sw.js.map
                  ! grep -Eqi 'access[_-]?token|Authorization|Bearer|idbLoad|tryDecryptToken|getAuthData|pickleKey|media/v3' apps/web/webapp/sw.js apps/web/webapp/sw.js.map
